<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030817" />
    <title>CosmosWhisper · 活动星图</title>
    <style>
      :root{color-scheme:dark}
      *{box-sizing:border-box}
      html,body{width:100%;height:100%;min-width:0;min-height:0;margin:0;overflow:hidden;background:#030817;color:#f0eee5}
      body{display:flex;justify-content:center;align-items:flex-start}
      #planisphere-app{position:relative;width:100vmin;height:100vmin;touch-action:none}
      #planisphere-canvas{display:block;width:100%;height:100%;cursor:default;touch-action:none;outline:none}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    </style>
  </head>
  <body>
    <main id="planisphere-app" aria-label="CosmosWhisper 活动星图">
      <canvas id="planisphere-canvas" role="img" aria-label="可旋转的活动星图"></canvas>
      <p id="planisphere-status" class="sr-only" role="status">活动星图加载中。</p>
    </main>
    <script type="module" src="./planisphere.js"></script>
  </body>
</html>
