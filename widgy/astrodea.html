<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030817" />
    <title>CosmosWhisper · Celestial Dial</title>
    <style>
      :root{color-scheme:dark}
      *{box-sizing:border-box}
      html,body{width:100%;height:100%;min-width:0;min-height:0;margin:0;overflow:hidden;background:#030817}
      body{display:flex;justify-content:center;align-items:flex-start}
      #astrodea-app{position:relative;width:100vmin;height:100vmin;touch-action:none}
      #astrodea-canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    </style>
  </head>
  <body>
    <main id="astrodea-app" aria-label="CosmosWhisper Astrodea 风格活动星图">
      <canvas id="astrodea-canvas" role="img" aria-label="Astrodea 风格活动星图"></canvas>
      <p id="astrodea-status" class="sr-only" role="status">星图加载中。</p>
    </main>
    <script type="module" src="./astrodea.js"></script>
  </body>
</html>
