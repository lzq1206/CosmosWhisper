<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030817" />
    <title>CosmosWhisper · 城市星图</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #sky-app {
        position: relative;
        inset: auto;
        width: 100vmin;
        height: 100vmin;
      }
    </style>
  </head>
  <body data-widget="true">
    <main id="sky-app" aria-label="CosmosWhisper 城市本地天空星图">
      <canvas id="sky-canvas" role="img" aria-label="城市本地天空星图" aria-describedby="canvas-status"></canvas>
      <p class="sr-only" id="canvas-status" role="status">星图加载中。</p>
    </main>
    <script type="module">
      import { CITY_BY_ID } from "../src/data/cities.js";

      const id = new URLSearchParams(window.location.search).get("city") || "beijing";
      const city = CITY_BY_ID.get(id) || CITY_BY_ID.get("beijing");
      document.title = `CosmosWhisper · ${city.name}`;
      try {
        localStorage.setItem("cosmos-whisper-location", JSON.stringify({
          lat: city.lat,
          lon: city.lon,
          name: city.name,
          source: "city-index",
        }));
      } catch {}
      await import("../src/main.js");
    </script>
  </body>
</html>
