name: Refresh ScriptWidget chart snapshots

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "styles.css"
      - "widgy/city.html"
      - "widgy/watch/**"
      - "scripts/generate-widget-snapshots.mjs"
      - "src/data/cities.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-widget-snapshots.yml"

permissions:
  contents: write

concurrency:
  group: widget-snapshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture every city page after it renders
        env:
          SNAPSHOT_BASE_URL: http://127.0.0.1:4173
          SNAPSHOT_CONCURRENCY: "8"
          WIDGET_SNAPSHOT_OUTPUT: ${{ runner.temp }}/cosmoswhisper-widget-snapshots
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cosmoswhisper-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/generate-widget-snapshots.mjs
      - name: Publish snapshots to the widget-snapshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R "${{ runner.temp }}/cosmoswhisper-widget-snapshots/." "$publish_dir/"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Refresh city chart snapshots"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:widget-snapshots

