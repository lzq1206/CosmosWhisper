name: Refresh ScriptWidget chart snapshots

on:
  schedule:
    # 每 3 小时运行一次，避开整点高峰（UTC）。
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "styles.css"
      - "widgy/city.html"
      - "widgy/watch/**"
      - "scripts/generate-widget-snapshots.mjs"
      - "scripts/publish-widget-snapshots.mjs"
      - "src/data/cities.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-widget-snapshots.yml"

permissions:
  contents: write

concurrency:
  group: widget-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture missing quarter-hour snapshots for the next 12 hours
        env:
          SNAPSHOT_BASE_URL: http://127.0.0.1:4173
          SNAPSHOT_CONCURRENCY: "10"
          SNAPSHOT_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/widget-snapshots/manifest.json?run=${{ github.run_id }}-${{ github.run_attempt }}
          WIDGET_SNAPSHOT_OUTPUT: ${{ runner.temp }}/cosmoswhisper-widget-snapshots
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cosmoswhisper-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/generate-widget-snapshots.mjs
      - name: Publish and prune the rolling snapshot set
        env:
          WIDGET_SNAPSHOT_OUTPUT: ${{ runner.temp }}/cosmoswhisper-widget-snapshots
          WIDGET_SNAPSHOT_PUBLISH_DIR: ${{ runner.temp }}/cosmoswhisper-snapshot-publish
        run: node scripts/publish-widget-snapshots.mjs

