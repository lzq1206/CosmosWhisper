<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030817" />
    <title>CosmosWhisper · 可见天区</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #030817;
      }
      body {
        display: grid;
        place-items: center;
      }
      #sky-app {
        position: relative;
        width: 100vmin;
        height: 100vmin;
        touch-action: none;
      }
      #sky-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body data-widget="true" data-native-location="true">
    <main id="sky-app" aria-label="CosmosWhisper 本地可见天区星图">
      <canvas id="sky-canvas" role="img" aria-label="可见天区星图" aria-describedby="canvas-status"></canvas>
      <p class="sr-only" id="canvas-status" role="status">星图加载中。</p>
    </main>
    <script type="module" src="../src/main.js"></script>
  </body>
</html>
