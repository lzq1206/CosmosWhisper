<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030817">
  <title>太阳系行星表盘 · CosmosWhisper</title>
  <link rel="stylesheet" href="./solar.css?v=20261103.4">
</head>
<body>
  <main>
    <header><p class="eyebrow">COSMOSWHISPER / SOLAR SYSTEM</p><h1>太阳系行星表盘</h1><p>黄道北侧俯视 · 日心位置</p></header>
    <canvas id="dial" width="1200" height="1200" role="img" aria-label="太阳和八大行星日心位置示意图"></canvas>
    <p id="time" aria-live="polite"></p>
    <div class="controls"><label>选择时间 <input type="datetime-local" id="date"></label><button id="now" type="button">返回实时</button></div>
    <p id="location-status">时间环地点：北京</p><button id="locate" type="button">使用当前位置</button>
    <p class="note">椭圆形轨道保留各行星的偏心率；轨道间距、月球轨道与天体大小经过缩放。<br>位置与光照采用近似模型。</p>
    <a class="home" href="../">← 返回星图首页</a>
  </main>
  <script type="module" src="./dial.js?v=20261103.6"></script>
</body>
</html>
